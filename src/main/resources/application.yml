spring:
  application:
    name: authentication
server:
  port: 9000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_SERVER_PORT}/eureka/
  instance:
    prefer-ip-address: true
    instanceId: ${spring.cloud.client.hostname}:${spring.application.name}:${random.value}

logging:
  level:
    com.utp.authentication: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
